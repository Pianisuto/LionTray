name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax-and-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install schema tools
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-bin

      - name: Check
        run: make check
